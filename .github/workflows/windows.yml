name: Сборка Statistika для Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Тесты
        run: python -m pytest -q
      - name: Упаковка EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name Statistika --paths . --add-data "statistika/data/catalog.json:statistika/data" statistika/__main__.py
      - name: Проверка запуска собранного EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/Statistika.exe').Path
          $result = Join-Path $env:RUNNER_TEMP 'statistika-self-test.txt'
          $process = Start-Process -FilePath $exe -ArgumentList ('--self-test "{0}"' -f $result) -Wait -PassThru
          if (-not (Test-Path -LiteralPath $result)) {
            throw "EXE не создал отчёт о запуске. Код: $($process.ExitCode)"
          }
          $log = Get-Content -LiteralPath $result -Raw
          if ($process.ExitCode -ne 0 -or $log.Trim() -ne 'OK') {
            throw "Проверка EXE не пройдена:`n$log"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Statistika-Windows-x64
          path: dist/Statistika.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Statistika-Windows-x64
          path: dist
      - name: Опубликовать проверенный EXE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=${COMMIT_MESSAGE%%$'\n'*}
          if [[ ! "$subject" =~ ^Release\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo 'Ожидается тема коммита Release vX.Y.Z' >&2
            exit 1
          fi
          tag=${BASH_REMATCH[1]}
          gh release create "$tag" 'dist/Statistika.exe#Statistika.exe · Windows x64' \
            --target "$GITHUB_SHA" --title "Statistika $tag — Windows x64" \
            --notes-file "docs/releases/$tag.md"
